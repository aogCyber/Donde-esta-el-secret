<!DOCTYPE html>
<html>
<head>
    <title>Employee Portal</title>
</head>

<body>

<h1>Employee Directory</h1>

<table border="1" cellpadding="8">

<tr>
    <th>ID</th>
    <th>User</th>
    <th>Name</th>
    <th>Department</th>
</tr>

{% for employee in employees %}

<tr>

<td>{{ employee[0] }}</td>

<td>{{ employee[1] }}</td>

<td>{{ employee[2] }}</td>

<td>{{ employee[3] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
